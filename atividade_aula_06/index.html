<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atividade Aula 06" />
    <meta name="author" content="Ivan" />
    <title>Comida Tipica Nordestina</title>
    <link rel="stylesheet" href="./css/estilo.css" />
  </head>
  <body>
    <main>
      <div class="linha">
        <div class="card">
          <h2>A Melhor comida do Nordeste</h2>
          <p>
            O cuscuz é um prato feito com farinha de milho e que tem boas
            quantidades de fibras, nutrientes que estimulam os movimentos
            naturais do intestino, ajudando a combater a prisão de ventre. Além
            disso, o cuscuz também ajuda no ganho de massa muscular.
          </p>
          <figure>
            <img
            src="./img/cuscuz.png"
            width="300px"
            alt="Fotografia de um cuscuz peitinho de moça apresentado em formato moldado, com topo arredondado e pequena elevação central característica. O prato branco possui círculos azuis decorativos na borda. O cuscuz tem coloração amarelo-viva e textura granulada. Na lateral inferior, é possível visualizar o recheio escuro contrastando com a massa. Ao fundo, aparecem parcialmente outros utensílios de mesa, desfocados. A imagem destaca a apresentação tradicional do prato nordestino."
            />
            <figcaption>Cuscuz Petinho de Moça</figcaption>
          </figure>
          <button>Ir para Receita</button>
        </div>
      </div>
    </main>
  </body>
</html>
