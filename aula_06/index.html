<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 06</title>
    <link rel="stylesheet" href="./assets/css/estilo.css" />
    <meta
      name="description"
      content="Aula 06 - Aprofundando  os conhecimentos em flexbox!"
    />
    <meta name="author" content="Ivan" />
  </head>
  <body>
    <main>
      <div class="linha">
        <div class="card">
          <h3>Biografia do Artista Rapdura</h3>
          <figure>
            <img
              src="./assets/img/rapadura.png"
              width="168"
              alt="Fotografia vertical com fundo totalmente preto. No centro da imagem, uma pessoa posa de frente para a câmera usando chapéu de palha claro e uma veste ampla estampada em tons de rosa. O braço esquerdo está projetado para a frente, com a mão aberta ocupando destaque no primeiro plano. O restante do corpo aparece levemente recuado, criando perspectiva. Os cabelos são longos e volumosos. A iluminação de estúdio realça as texturas do chapéu, das roupas e dos cabelos, contrastando com o fundo escuro. No canto inferior esquerdo, aparece a assinatura “© Eddie Silva”."
            />
            <figcaption>Artista Rapadura</figcaption>
          </figure>
          <button>Ir para Biografia</button>
        </div>
        <div class="card">
          <h3>Biografia do Guanabara Guanabara</h3>
          <figure>
            <img
              src="./assets/img/gustavo_guanabara.png"
              width="250"
              alt="Fotografia enquadrada dos ombros para cima. No centro da imagem, uma pessoa usa óculos de armação preta, camiseta preta e um relógio escuro no pulso. A mão esquerda aparece erguida próxima à câmera, com os dedos abertos e uma aliança visível em um dos dedos. Ao fundo, há uma estante desfocada com livros coloridos e objetos decorativos, criando um ambiente interno acolhedor. A iluminação destaca os detalhes do rosto, dos óculos e da mão, enquanto o fundo permanece suavemente desfocado."
            />
            <figcaption>Professor Guanabara</figcaption>
          </figure>
          <button>Ir para Biografia</button>
        </div>
      </div>
    </main>
  </body>
</html>
<footer></footer>
