<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link css -->
    <link rel="stylesheet" href="./assets/css/estilo.css" />

    <link rel="author" href="Ivan" />

    <!-- Fonte google rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- Imptaçãodo bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <!-- Imptaçãodo Icons bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <title>Formulario de cadastro senac</title>
  </head>
  <body>
    <header>
      <img
        src="./assets/img/logo-senac.png"
        alt="iamgem representanod o topo do site formulario do senac"
      />
    </header>
    <main>
      <div class="form-cadastro">
        <h3>Formulario Senac</h3>
        <form action="" method="get">
          <div class="uma-coluna">
            <label for="nome-completo"
              >Nome completo (Sem abreviações, conforme dcomento de
              identificação)</label
            >
            <input type="text" name="nome-completo" required />
          </div>
          <div class="duas-colunas">
            <label for="cpf">CPF</label>
            <input type="text" name="cpf" required />

            <label for="data-nascimetno">Data nascimento</label>
            <input type="date" name="data-nascimetno" />
          </div>
          <div class="duas-colunas">
            <label for="cep">CEP</label>
            <input type="text" name="cep" maxlength="8" required />

            <label for="rua">Rua</label>
            <input type="text" name="rua" />
          </div>
          <div class="tres-coluna">
            <label for="bairro">Bairro</label>
            <input type="text" name="bairro" />

            <label for="numero">Número</label>
            <input type="text" name="numero" maxlength="5" />

            <label for="complemento">Complemento</label>
            <input type="text" name="complemento" />
          </div>
          <div class="duas-coluna">
            <label for="estado">Estado(UF)</label>
            <select id="estado" required>
              <option value="">Selecione o estado</option>
            </select>

            <label for="cidade">Cidade</label>
            <select id="cidade" required>
              <option value="">Selecione a Cidade</option>
            </select>
          </div>
          <div class="duas-coluna">
            <label for="telefone">Telefone</label>
            <input type="tel" name="telefone" />

            <label for="email">E-mail</label>
            <input type="email" name="email" required />
          </div>
          <div class="tres-coluna">
            <label for="escolaridade">Escolaridade</label>
            <select id="escolaridade" name="escolaridade" required>
              <option value="">Selecione</option>
              <option value="fundamental_incompleto">
                Fundamental Incompleto
              </option>
              <option value="fundamental_completo">Fundamental Completo</option>
              <option value="medio_incompleto">Médio Incompleto</option>
              <option value="medio_completo">Médio Completo</option>
            </select>
            <label for="genero">Genero</label>
            <select id="genero" name="genero">
              <option value="">Selecione</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
            </select>
            <label for="raca">raça</label>
            <select id="raca" name="raca">
              <option value="">Selecione</option>
              <option value="branca">Branca</option>
              <option value="preta">Preta</option>
              <option value="amarela">Amarela</option>
              <option value="indigena">Indigena</option>
              <option value="prefico-nao-informar">Prefiro não informar</option>
            </select>
          </div>
          <button type="submit">Enviar</button>
          <script>
            const estadoSelect = document.getElementById("estado");
            const cidadeSelect = document.getElementById("cidade");

            // Carregar estados
            fetch(
              "https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome",
            )
              .then((response) => response.json())
              .then((estados) => {
                estados.forEach((estado) => {
                  const option = document.createElement("option");
                  option.value = estado.sigla;
                  option.textContent = estado.nome;
                  estadoSelect.appendChild(option);
                });
              });

            // Carregar cidades conforme o estado
            estadoSelect.addEventListener("change", function () {
              const uf = this.value;

              cidadeSelect.innerHTML =
                '<option value="">Carregando...</option>';
              cidadeSelect.disabled = true;

              if (!uf) {
                cidadeSelect.innerHTML =
                  '<option value="">Selecione primeiro o estado</option>';
                return;
              }

              fetch(
                `https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios`,
              )
                .then((response) => response.json())
                .then((cidades) => {
                  cidadeSelect.innerHTML =
                    '<option value="">Selecione a cidade</option>';

                  cidades.forEach((cidade) => {
                    const option = document.createElement("option");
                    option.value = cidade.nome;
                    option.textContent = cidade.nome;
                    cidadeSelect.appendChild(option);
                  });

                  cidadeSelect.disabled = false;
                });
            });
          </script>
        </form>
      </div>
    </main>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
