<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonte google rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- Imptaçãodo bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <!-- Imptaçãodo Icons bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <title>Aula 11</title>
    <link rel="stylesheet" href="./assets/css/estilo.css" />
    <link rel="author" href="Ivan" />
  </head>
  <body>
    <div class="form-cadastro">
      <form action="" method="get">
        <label for="nome">Nome completo</label>
        <input type="text" name="nome-completo" placeholder="Digite seu nome" required/>
        <label for="senha">Senha</label>
        <input type="password" name="senha" minlength="8" required/>
        <label for="data-nascimento">Data de nascimento</label>
        <input type="date" name="data-nascimento" required/>
        <label for="descricao">Fale sobre você</label>
        <textarea name="descricao" rows="5"></textarea>
        <label for="telfone">Telefone</label>
        <input type="tel" name="Telefone" />
        <label for="foto">Foto do perfil</label>
        <input type="file" name="foto" size="10mb" accept=".png, .pdf"/>
        <label for="email">E-mail</label>
        <input type="email" name="email" />
        <button type="submit">Enviar formulario</button>
      </form>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
